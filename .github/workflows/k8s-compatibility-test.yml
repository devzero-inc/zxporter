name: Kubernetes Compatibility Test

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # The "Test on K8s ... (manifest)" jobs are required status checks, so we
  # cannot use trigger-level paths-ignore (a non-running required check blocks
  # merges forever). Instead we gate the build job on a changes filter; the test
  # matrix `needs: build`, so it is skipped automatically when build is skipped,
  # and skipped required checks are treated as satisfied.
  #
  # helm-chart/** is intentionally NOT ignored: helm-mode deploys render the
  # chart templates, so chart changes must still be tested.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  build:
    name: Build Docker Image
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      testserver_img: ${{ steps.build.outputs.testserver_img }}
      stress_img: ${{ steps.build.outputs.stress_img }}
      nodemon_img: ${{ steps.build.outputs.nodemon_img }}
      commit_hash: ${{ steps.build.outputs.commit_hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images
        id: build
        uses: ./.github/actions/k8s-compat-build

  test:
    name: Test on K8s ${{ matrix.k8s-version }} (${{ matrix.deployment-method }})
    needs: build
    runs-on: ubuntu-xl
    strategy:
      fail-fast: false
      matrix:
        # K8s versions from the last ~2 years; see https://kubernetes.io/releases/
        k8s-version:
          - v1.31.14
          - v1.32.11
          - v1.33.7
          - v1.34.3
          - v1.35.1
          - v1.36.1
        deployment-method:
          - helm
          # "manifest" (unchanged name — required-status-check contexts in the
          # branch ruleset are pinned to "Test on K8s <version> (manifest)" for
          # all six k8s-versions; renaming it would silently strand those checks
          # and block every future merge) exercises dist/install.yaml. The new
          # manifest-lowpriv variant exercises dist/install-lowpriv.yaml — same
          # coverage, extended to the no-hostPID/root/SYS_PTRACE bundle.
          - manifest
          - manifest-lowpriv
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run k8s-compat test
        uses: ./.github/actions/k8s-compat-test
        with:
          k8s-version: ${{ matrix.k8s-version }}
          deployment-method: ${{ matrix.deployment-method }}
          zxporter-img: ${{ needs.build.outputs.image }}
          commit-hash: ${{ needs.build.outputs.commit_hash }}
          testserver-img: ${{ needs.build.outputs.testserver_img }}
          stress-img: ${{ needs.build.outputs.stress_img }}
          nodemon-img: ${{ needs.build.outputs.nodemon_img }}
          commit-sha: ${{ github.sha }}
