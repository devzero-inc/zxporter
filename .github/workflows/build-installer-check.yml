name: Build Installer Check

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'helm-chart/**'
  workflow_dispatch:

jobs:
  build-installer-check:
    name: Check if build-installer produces changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Composite action; single source of truth for the actual check logic.
      # The services-side sibling workflow points at the same file via
      # ./operators/zxporter/.github/actions/installer-check.
      - name: Check installer manifests
        uses: ./.github/actions/installer-check
