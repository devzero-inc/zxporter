name: runtime-metrics-kind

# Language-agnostic end-to-end validation of zxporter-nodemon's runtime
# detection on a real kind cluster. Actual test logic lives in the
# composite action at .github/actions/runtime-metrics-kind so the services
# monorepo can reuse it via ./operators/zxporter/.github/actions/runtime-metrics-kind.

permissions:
  contents: read

on:
  pull_request:
    # Nodemon helm chart templates are exercised here, so do not ignore
    # helm-chart/** — only skip documentation-only changes.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  runtime-metrics-kind:
    runs-on: namespace-profile-dz-generic
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run runtime-metrics-kind
        uses: ./.github/actions/runtime-metrics-kind
