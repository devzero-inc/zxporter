name: Run Tests
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # "Run make test" is a required status check, so we cannot use trigger-level
  # paths-ignore (a non-running required check blocks merges forever). Instead we
  # gate the job on a changes filter: when only docs/helm-chart change the job is
  # skipped, and a skipped required check is treated as satisfied.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      # paths-filter uses the GitHub API on pull_request events, but on push
      # events it shells out to git and needs the repo checked out first.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!helm-chart/**'

  test:
    name: Run make test
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Composite action; single source of truth for the actual test logic.
      # Path resolves to .github/actions/tests inside THIS repo (whichever it
      # is: devzero-inc/zxporter published, or devzero-inc/services under
      # operators/zxporter/). The services-side sibling workflow points at
      # the same file via ./operators/zxporter/.github/actions/tests.
      - name: Run tests
        uses: ./.github/actions/tests
