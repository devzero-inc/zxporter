name: "zxporter: golangci-lint"
description: |
  Runs golangci-lint against the zxporter tree. Consumed by two callers:

    - operators/zxporter/.github/workflows/golangci-lint.yml (published to
      devzero-inc/zxporter as .github/workflows/golangci-lint.yml)
    - .github/workflows/zxporter-lint.yml on services root

  Both paths resolve to this same file on disk.

inputs:
  working-directory:
    description: "Path to the zxporter tree relative to the repo root."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod
        cache: true
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum

    - name: Download dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod download

    - name: Generate code
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: make generate

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        working-directory: ${{ inputs.working-directory }}
        # Install from source to match Go 1.25
        install-mode: goinstall
        version: v1.62.2
        args: --timeout=5m
        # Show only new issues for PRs
        only-new-issues: true
