# Default values for zxporter.
#
# REQUIRED FIELDS:
# The following fields MUST be configured before deployment:
# 1. zxporter.clusterToken OR zxporter.patToken (at least one required)
# 2. zxporter.kubeContextName - unique identifier for your cluster
# 3. global.k8sProvider - one of: aws, gcp, azure, oci, other
#
# For production deployments, we recommend using patToken for automatic token exchange.

image:
  repository: public.ecr.aws/devzeroinc/zxporter
  pullPolicy: IfNotPresent
  tag: "v0.1.2"
# ZXPorter configuration
zxporter:
  dakrUrl: "https://dakr.devzero.io"
  targetNamespaces: ""
  # Cluster token for authentication with the DevZero platform
  # Required: Either clusterToken or patToken must be provided
  clusterToken: ""
  # Personal Access Token (PAT) for automatic cluster token exchange
  # If clusterToken is not provided but patToken is, the system will
  # automatically exchange the PAT for a cluster token on startup
  # This is the recommended approach for production deployments
  # Example: "dzu-aKAAyJgsrblR0dFmgnoB_sQjiVNs-I3Y4gI7jJnePgs="
  patToken: ""
  # Kubernetes context name to identify this cluster
  # Required: Must be set to a unique identifier for your cluster
  # Examples:
  #   - EKS: "arn:aws:eks:us-west-2:123456789012:cluster/my-cluster"
  #   - GKE: "gke_my-project_us-central1-a_my-cluster"
  #   - AKS: "my-aks-cluster"
  #   - OCI: "ocid1.cluster.oc1.iad.aaaaaaaa..."
  #   - Other: "production-cluster" or "staging-cluster"
  kubeContextName: ""
  # Set to true to store CLUSTER_TOKEN and PAT_TOKEN in Kubernetes Secrets instead of ConfigMap
  # Default is false for backward compatibility
  useSecretForToken: true
  # Log level for the zxporter application
  # Valid values: debug, info, error
  # Default: error
  logLevel: "error"
  # Disable GPU metrics collection (set to "true" for clusters without GPUs)
  disableGPUMetrics: ""
  # How many nodes' metrics NodeCollector fetches in parallel per sweep.
  # Raise this for clusters with hundreds of nodes — see the
  # NodeMetricsConcurrency field doc in api/v1/collectionpolicy_types.go for
  # the reasoning and its interaction with nodemonRequestTimeout/
  # kubeletFallbackTimeout below. This default is a starting point, not
  # empirically load-tested against very large fleets.
  nodeMetricsConcurrency: 20
  # How long the controller waits for a single HTTP call to a node's nodemon
  # pod before giving up. Go duration string, e.g. "15s".
  nodemonRequestTimeout: "15s"
  # How long the controller waits for a single call to the kubelet Summary
  # API (the metrics fallback for nodes with no nodemon pod) before giving
  # up. Go duration string, e.g. "15s".
  kubeletFallbackTimeout: "15s"
  # Point to a pre-existing Secret that already holds the auth token(s), instead of
  # passing clusterToken/patToken through this values file. This is intended for
  # GitOps/SOPS workflows where you want to encrypt only the Secret, not the whole
  # values file.
  #
  # When existingSecret.name is set:
  #   - the chart does NOT create the credentials Secret (you manage it yourself)
  #   - the controller sources PAT_TOKEN and/or CLUSTER_TOKEN from this Secret
  #   - it satisfies the "a token is required" validation
  #
  # Requirements:
  #   - The Secret must already exist in the release namespace (secretKeyRef is
  #     namespace-local) before the controller pod starts.
  #   - It must contain at least one of the keys below. Both env vars are injected
  #     with optional=true, so a Secret with only one key is fine.
  #   - Only meaningful when useSecretForToken=true.
  existingSecret:
    # Name of the pre-existing Secret. Leave empty to use clusterToken/patToken above.
    name: ""
    # Key within the Secret holding the cluster token (direct-token installs).
    clusterTokenKey: "CLUSTER_TOKEN"
    # Key within the Secret holding the PAT token (PAT-exchange installs).
    patTokenKey: "PAT_TOKEN"
  # Resource names for token storage (configurable for different environments)
  # Input credentials Secret: Contains initial PAT/CLUSTER tokens (user-managed)
  tokenCredentialsSecretName: "devzero-zxporter-credentials"
  # Runtime token Secret: Contains exchanged tokens (system-managed)
  tokenSecretName: "devzero-zxporter-token"
  # ConfigMap: Contains configuration and tokens when useSecretForToken=false
  tokenConfigMapName: "devzero-zxporter-env-config"
# ZXPorter controller resources
resources:
  requests:
    cpu: 200m
    memory: 2Gi
  limits: {}
nodeSelector: {}
tolerations: []
affinity: {}
# High Availability Configuration
highAvailability:
  enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
# MPA Server Configuration
mpaServer:
  port: 50051
# Priority Class for critical workloads
# global.priorityClass.enabled is the single source of truth for whether the
# custom PriorityClass is used at all. Being a global, it auto-propagates to the
# nodemon subchart, so the object (created here) and the DaemonSet reference (in
# the subchart) can never drift out of sync.
global:
  # k8sProvider is the SINGLE source of truth for the cloud provider. It is
  # shared by the parent chart (controller K8S_PROVIDER env) and the bundled
  # zxporter-nodemon subchart (which gates its GPU driver hostPath/LD_LIBRARY_PATH
  # on provider=gcp). Being a global, it auto-propagates to the subchart, so it
  # must ONLY be set here — never on zxporter-nodemon.provider.
  # Required: one of "aws", "gcp", "azure", "oci", "other".
  k8sProvider: ""
  # global.gpuRuntime drives the bundled nodemon GPU DaemonSet and the parent
  # chart's resolver RBAC. Auto is the controller-managed mode; default keeps
  # the split DaemonSet but does not render resolver RBAC; explicit lets callers
  # choose a fixed RuntimeClass without the resolver.
  gpuRuntime:
    mode: auto
    runtimeClassName: nvidia
  priorityClass:
    enabled: true
priorityClass:
  value: 1000000000
  description: "This priority class is for critical zxporter infrastructure components."
  preemptionPolicy: PreemptLowerPriority
# Subchart overrides. The parent chart owns the PriorityClass object, so the
# bundled nodemon subchart must NOT create it again (would be a duplicate
# resource). The DaemonSet still references it, gated on the shared global.
zxporter-nodemon:
  priorityClass:
    create: false
