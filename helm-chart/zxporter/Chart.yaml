apiVersion: v2
name: zxporter
description: A Helm chart for DevZero ZXPorter - Kubernetes resource monitoring and optimization
type: application
version: 0.1.22
appVersion: "0.1.22"
home: https://github.com/devzero-inc/zxporter
sources:
  - https://github.com/devzero-inc/zxporter
icon: https://devzero-dashboard.b-cdn.net/logo.png
maintainers:
  - name: DevZero Team
    email: support@devzero.io
keywords:
  - monitoring
  - kubernetes
  - resource-optimization
  - devzero
dependencies:
  # Shared DevZero chart conventions (labels). A byte-identical copy of the
  # monorepo's charts/devzero-common, kept here so the public zxporter repo
  # carries it; scripts/chart_lint.py fails CI if the copy drifts.
  - name: devzero-common
    version: 0.1.0
    repository: "file://../devzero-common"
  - name: zxporter-nodemon
    version: "0.1.22"
    repository: "file://../zxporter-nodemon"
