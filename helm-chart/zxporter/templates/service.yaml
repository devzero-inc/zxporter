apiVersion: v1
kind: Service
metadata:
  {{- with (include "zxporter.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- with (include "zxporter.commonLabels" $) }}
    {{- . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: devzero-zxporter
    control-plane: controller-manager
  name: devzero-zxporter-controller-manager-metrics-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 8443
  selector:
    control-plane: controller-manager
