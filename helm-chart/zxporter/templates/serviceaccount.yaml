apiVersion: v1
kind: ServiceAccount
metadata:
  {{- with (include "zxporter.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- with (include "zxporter.commonLabels" $) }}
    {{- . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: devzero-zxporter
  name: devzero-zxporter-controller-manager
  namespace: {{ .Release.Namespace }}
