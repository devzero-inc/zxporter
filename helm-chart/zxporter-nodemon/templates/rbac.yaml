{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zxporter-nodemon.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zxporter-nodemon.labels" . | nindent 4 }}
  {{- /* serviceAccount.annotations wins over commonAnnotations on a key
         collision. Merged here rather than emitted as two blocks because
         `with` rebinds the dot, which would hand the helper the annotation
         map instead of the root context. */}}
  {{- $saAnnotations := merge (deepCopy (.Values.serviceAccount.annotations | default dict)) (fromYaml (include "zxporter-nodemon.commonAnnotations" $)) }}
  {{- with $saAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.nodemon.rbac.clusterWide }}ClusterRole{{ else }}Role{{ end }}
metadata:
  {{- with (include "zxporter-nodemon.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  name: {{ include "zxporter-nodemon.fullname" . }}
  labels:
    {{- include "zxporter-nodemon.labels" . | nindent 4 }}
  {{- if not .Values.nodemon.rbac.clusterWide }}
  namespace: {{.Release.Namespace}}
  {{- end }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  {{- /* watch is unconditional: the node-scoped pod informer (PodContainerIndex)
         needs list+watch whenever cgroupMetrics OR runtimeMetrics is on, and
         watch exposes nothing list does not. */}}
  - get
  - list
  - watch
- apiGroups:
    - apps
  resources:
    - replicasets
    - deployments
    - statefulsets
    - daemonsets
  verbs:
    - get
- apiGroups:
    - batch
  resources:
    - jobs
    - cronjobs
  verbs:
    - get
- apiGroups:
    - argoproj.io
  resources:
    - rollouts
  verbs:
    - get
- apiGroups:
    - ""
  resources:
    - nodes/proxy
    - nodes/metrics
    - nodes/stats
  verbs:
    - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.nodemon.rbac.clusterWide }}ClusterRoleBinding{{ else }}RoleBinding{{ end }}
metadata:
  {{- with (include "zxporter-nodemon.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  name: {{ include "zxporter-nodemon.fullname" . }}
  labels:
    {{- include "zxporter-nodemon.labels" . | nindent 4 }}
  {{- if not .Values.nodemon.rbac.clusterWide }}
  namespace: {{.Release.Namespace}}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.nodemon.rbac.clusterWide }}ClusterRole{{ else }}Role{{ end }}
  name: {{ include "zxporter-nodemon.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "zxporter-nodemon.serviceAccountName" . }}
  namespace: {{.Release.Namespace}}
{{- end }}
