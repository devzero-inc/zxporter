{{- include "zxporter-nodemon.validateConfig" . -}}
{{- $gpuMode := default "explicit" (dig "gpuRuntime" "mode" "" .Values.global) -}}
{{- $gpuClass := dig "gpuRuntime" "runtimeClassName" "" .Values.global | default "" | toString }}
{{- $gpuRuntime := "" -}}
{{- if or (eq $gpuMode "auto") (eq $gpuMode "explicit") -}}
{{- $gpuRuntime = $gpuClass -}}
{{- end -}}
{{- $provider := required ".Values.global.k8sProvider is required (gcp|aws|azure|oci|other)" .Values.global.k8sProvider }}
{{- $legacyRuntimeClassName := .Values.dcgmExporter.runtimeClassName | default "" | toString }}
{{- $gpuKey := .Values.dcgmExporter.gpuNodeSelector.key | default "" | toString }}
{{- $gpuVal := .Values.dcgmExporter.gpuNodeSelector.value | default "" | toString }}
{{- $split := and .Values.dcgmExporter.enabled (ne $gpuKey "") (ne $gpuVal "") (ne $legacyRuntimeClassName "") }}
{{- /* runtimeMetrics.enabled is the canonical toggle for hostPID + root + SYS_PTRACE
       (needed by every process-introspection collector: JVM, Node.js, ...). jvmMetrics.enabled
       is kept as a deprecated fallback for installs that already override it explicitly. */}}
{{- $runtimeMetricsEnabled := .Values.jvmMetrics.enabled }}
{{- if hasKey (.Values.runtimeMetrics | default dict) "enabled" }}
{{- $runtimeMetricsEnabled = .Values.runtimeMetrics.enabled }}
{{- end }}
{{- /* runtimeMetrics.runAsRoot (default true) runs nodemon as UID 0 with
       SYS_PTRACE. Set to false, it keeps hostPID but runs nodemon with
       nodemon.securityContext (non-root, no SYS_PTRACE): runtime detection,
       cmdline-based versions and JVM flags still work; heap metrics and
       env/binary versions do not, since they read other users'
       /proc/<pid>/{environ,exe,root}. */}}
{{- $runtimeAsRoot := and $runtimeMetricsEnabled (dig "runAsRoot" true (.Values.runtimeMetrics | default dict)) }}
{{- /* cgroupMetrics.enabled gates the read-only /sys/fs/cgroup mount + reader.
       Defaults to true and, unlike runtimeMetrics, needs no hostPID/root/SYS_PTRACE. */}}
{{- $cgroupMetricsEnabled := dig "enabled" true (.Values.cgroupMetrics | default dict) }}
{{- /* Bounds how long the scan-heavy /container/jvm-metrics and
       /container/runtime-metrics handlers may take per request. Empty
       string means "use the built-in default (2.5s)" — see
       nodemon.DefaultScanHandlerTimeout. */}}
{{- $scanHandlerTimeoutMs := dig "scanHandlerTimeoutMs" "" (.Values.runtimeMetrics | default dict) }}
{{- $base := include "zxporter-nodemon.fullname" . }}
{{- $gpuName := printf "%s-gpu" ($base | trunc 59 | trimSuffix "-") }}
{{- $gpuDefaultRuntimeName := printf "%s-gpu-default-runtime" ($base | trunc 43 | trimSuffix "-") }}
{{- $dcgmMode := .Values.dcgmExporter.mode | default "gpuOnly" | toString }}
{{- if not (has $dcgmMode (list "gpuOnly" "everyNode")) }}
{{-   fail (printf "dcgmExporter.mode must be gpuOnly or everyNode; got %q" $dcgmMode) }}
{{- end }}
{{- /* GPU detection. gpuNodeSelector (key/value) names the GPU Operator nodes,
       the only ones known to carry the RuntimeClass; gpuNodeSelectors lists the
       other labels clouds and provisioners put on GPU nodes. A node is a GPU
       node when it matches ANY of them. */}}
{{- $runtimeExpr := dict }}
{{- if and (ne $gpuKey "") (ne $gpuVal "") }}
{{-   $runtimeExpr = dict "key" $gpuKey "operator" "In" "values" (list $gpuVal) }}
{{- end }}
{{- $otherGPUExprs := list }}
{{- range $sel := (.Values.dcgmExporter.gpuNodeSelectors | default list) }}
{{-   if not (and (kindIs "map" $sel) $sel.key $sel.operator) }}
{{-     fail (printf "dcgmExporter.gpuNodeSelectors entries need key and operator; got %v" $sel) }}
{{-   end }}
{{-   $op := toString $sel.operator }}
{{-   $vals := $sel.values | default list }}
{{- /* Only operators with an exact negation: the CPU DaemonSet must match
         every node no GPU selector matches. Gt/Lt cannot be negated for a
         node whose label is present but not an integer, which would then
         run no nodemon at all. */}}
{{-   if not (has $op (list "In" "NotIn" "Exists" "DoesNotExist")) }}
{{-     fail (printf "dcgmExporter.gpuNodeSelectors: unsupported operator %q on %s (use In, NotIn, Exists or DoesNotExist)" $op (toString $sel.key)) }}
{{-   end }}
{{-   $expr := dict "key" (toString $sel.key) "operator" $op }}
{{-   if has $op (list "In" "NotIn") }}
{{-     if eq (len $vals) 0 }}
{{-       fail (printf "dcgmExporter.gpuNodeSelectors: %s on %s needs at least one value" $op (toString $sel.key)) }}
{{-     end }}
{{-     $strVals := list }}
{{-     range $v := $vals }}
{{-       $strVals = append $strVals (toString $v) }}
{{-     end }}
{{-     $_ := set $expr "values" $strVals }}
{{-   else if gt (len $vals) 0 }}
{{-     fail (printf "dcgmExporter.gpuNodeSelectors: %s on %s takes no values" $op (toString $sel.key)) }}
{{-   end }}
{{-   $otherGPUExprs = append $otherGPUExprs $expr }}
{{- end }}
{{- $allGPUExprs := $otherGPUExprs }}
{{- if $runtimeExpr }}
{{-   $allGPUExprs = prepend $otherGPUExprs $runtimeExpr }}
{{- end }}
{{- /* "Not a GPU node" is the AND of every selector's exact negation: one
       selector term, matching precisely the nodes no GPU selector matches. */}}
{{- $notGPUExprs := list }}
{{- range $e := $allGPUExprs }}
{{-   if eq $e.operator "In" }}
{{-     $notGPUExprs = append $notGPUExprs (dict "key" $e.key "operator" "NotIn" "values" $e.values) }}
{{-   else if eq $e.operator "NotIn" }}
{{-     $notGPUExprs = append $notGPUExprs (dict "key" $e.key "operator" "In" "values" $e.values) }}
{{-   else if eq $e.operator "Exists" }}
{{-     $notGPUExprs = append $notGPUExprs (dict "key" $e.key "operator" "DoesNotExist") }}
{{-   else }}
{{-     $notGPUExprs = append $notGPUExprs (dict "key" $e.key "operator" "Exists") }}
{{-   end }}
{{- end }}
{{- $notGPUTerms := list $notGPUExprs }}
{{- /* Variants. gpuAff "none" keeps the user's affinity verbatim; "terms"
       ANDs the user's affinity with the variant's own selector terms (OR'd).
       withDcgm adds the sidecar, its volumes and annotations; runtime marks the
       DaemonSet the GPU runtime resolver manages (RuntimeClass + annotations).
       dcgmHost points nodemon at a local exporter: kept on every variant while
       DCGM is enabled so a node without one fails a cheap localhost connect
       instead of listing pods through the API server every refresh. */}}
{{- $dcgmOn := .Values.dcgmExporter.enabled }}
{{- $variants := list (dict "name" $base "instance" $base "withDcgm" $dcgmOn "dcgmHost" $dcgmOn "runtime" false "gpuAff" "none" "terms" list) }}
{{- if and $dcgmOn (eq $dcgmMode "everyNode") $split }}
{{-   $variants = list
        (dict "name" $base "instance" $base "withDcgm" true "dcgmHost" true "runtime" false "gpuAff" "terms" "terms" (list (list (dict "key" $gpuKey "operator" "NotIn" "values" (list $gpuVal)))))
        (dict "name" $gpuName "instance" $gpuName "withDcgm" true "dcgmHost" true "runtime" true "gpuAff" "terms" "terms" (list (list $runtimeExpr))) }}
{{- else if and $dcgmOn (eq $dcgmMode "gpuOnly") (gt (len $allGPUExprs) 0) }}
{{-   $variants = list (dict "name" $base "instance" $base "withDcgm" false "dcgmHost" true "runtime" false "gpuAff" "terms" "terms" $notGPUTerms) }}
{{-   if $split }}
{{-     $variants = append $variants (dict "name" $gpuName "instance" $gpuName "withDcgm" true "dcgmHost" true "runtime" true "gpuAff" "terms" "terms" (list (list $runtimeExpr))) }}
{{-     $defaultRuntimeTerms := list }}
{{-     range $e := $otherGPUExprs }}
{{-       $defaultRuntimeTerms = append $defaultRuntimeTerms (list $e (dict "key" $gpuKey "operator" "NotIn" "values" (list $gpuVal))) }}
{{-     end }}
{{-     if $defaultRuntimeTerms }}
{{-       $variants = append $variants (dict "name" $gpuDefaultRuntimeName "instance" $gpuDefaultRuntimeName "withDcgm" true "dcgmHost" true "runtime" false "gpuAff" "terms" "terms" $defaultRuntimeTerms) }}
{{-     end }}
{{-   else }}
{{-     $defaultRuntimeTerms := list }}
{{-     range $e := $allGPUExprs }}
{{-       $defaultRuntimeTerms = append $defaultRuntimeTerms (list $e) }}
{{-     end }}
{{-     $variants = append $variants (dict "name" $gpuDefaultRuntimeName "instance" $gpuDefaultRuntimeName "withDcgm" true "dcgmHost" true "runtime" false "gpuAff" "terms" "terms" $defaultRuntimeTerms) }}
{{-   end }}
{{- end }}
{{- range $v := $variants }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $v.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- with (include "zxporter-nodemon.commonLabels" $) }}
    {{- . | nindent 4 }}
    {{- end }}
    helm.sh/chart: {{ include "zxporter-nodemon.chart" $ }}
    app.kubernetes.io/name: {{ include "zxporter-nodemon.name" $ }}
    app.kubernetes.io/instance: {{ $v.instance }}
    {{- if $.Chart.AppVersion }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  {{- /* The kube-linter and gpu-runtime annotations belong to the DCGM variant,
         but commonAnnotations must reach this object either way: gating the
         whole block on withDcgm dropped them from every non-GPU install. */}}
  {{- $commonAnnotations := include "zxporter-nodemon.commonAnnotations" $ }}
  {{- if or $v.withDcgm $commonAnnotations }}
  annotations:
    {{- with $commonAnnotations }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $v.withDcgm }}
    ignore-check.kube-linter.io/privileged-container: "This daemon set needs to run DCGM Exporter as privileged to access the GPU metrics."
    ignore-check.kube-linter.io/run-as-non-root: "This daemon set needs to run DCGM Exporter as root to access the GPU metrics."
    ignore-check.kube-linter.io/privilege-escalation-container: "This daemon set needs escalate privileges for DCGM Exporter."
    ignore-check.kube-linter.io/no-read-only-root-fs: "This daemon set needs to run DCGM Exporter with read-only root filesystem."
    {{- if $v.runtime }}
    devzero.io/gpu-runtime-mode: {{ $gpuMode | quote }}
    devzero.io/gpu-runtime-class: {{ $gpuRuntime | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
spec:
  {{- with $.Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zxporter-nodemon.name" $ }}
      app.kubernetes.io/instance: {{ $v.instance }}
  template:
    metadata:
      {{- with (include "zxporter-nodemon.podExtraAnnotations" $) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- with (include "zxporter-nodemon.podExtraLabels" $) }}
        {{- . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: {{ include "zxporter-nodemon.name" $ }}
        app.kubernetes.io/instance: {{ $v.instance }}
    spec:
      {{- if $.Values.global.priorityClass.enabled }}
      {{- /* Lets the node agent schedule on memory-packed nodes instead of losing the
             scheduling race and leaving that node without telemetry. Custom class — NOT the
             reserved system-node-critical, which GKE blocks in non-kube-system namespaces (#445).
             Gated on the shared global so the reference and the PriorityClass object (created by
             this subchart when standalone, or the parent chart when bundled) can't drift. */}}
      priorityClassName: devzero-zxporter-devzero-zxporter-critical
      {{- end }}
      {{- if $runtimeMetricsEnabled }}
      hostPID: true
      {{- end }}
      {{- with include "zxporter-nodemon.imagePullSecrets" $ }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if $v.runtime }}
      {{- if ne $gpuRuntime "" }}
      runtimeClassName: {{ $gpuRuntime | quote }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ include "zxporter-nodemon.serviceAccountName" $ }}
      {{- if or $v.withDcgm $cgroupMetricsEnabled }}
      volumes:
        {{- if $v.withDcgm }}
        - name: "pod-gpu-resources"
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: {{- include "dcgm-exporter.config-map" $ | indent 1 }}
          configMap:
            name: {{- include "dcgm-exporter.config-map" $ | indent 1 }}
        {{- if eq $.Values.global.k8sProvider "gcp" }}
        - name: "nvidia-install-dir-host"
          hostPath:
            path: /home/kubernetes/bin/nvidia
        {{- end }}
        {{- end }}
        {{- if $cgroupMetricsEnabled }}
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        {{- end }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $v.gpuAff "none" }}
      {{- with $.Values.nodemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
      {{- $affinity := deepCopy ($.Values.nodemon.affinity | default dict) }}
      {{- $nodeAffinity := deepCopy (get $affinity "nodeAffinity" | default dict) }}
      {{- $required := deepCopy (get $nodeAffinity "requiredDuringSchedulingIgnoredDuringExecution" | default dict) }}
      {{- $userTerms := get $required "nodeSelectorTerms" | default list }}
      {{- $combinedTerms := list }}
      {{- range $variantTerm := $v.terms }}
      {{-   if gt (len $userTerms) 0 }}
      {{-     range $userTerm := $userTerms }}
      {{-       $term := deepCopy $userTerm }}
      {{-       $_ := set $term "matchExpressions" (concat (get $term "matchExpressions" | default list) $variantTerm) }}
      {{-       $combinedTerms = append $combinedTerms $term }}
      {{-     end }}
      {{-   else }}
      {{-     $combinedTerms = append $combinedTerms (dict "matchExpressions" $variantTerm) }}
      {{-   end }}
      {{- end }}
      {{- $_ := set $required "nodeSelectorTerms" $combinedTerms }}
      {{- $_ := set $nodeAffinity "requiredDuringSchedulingIgnoredDuringExecution" $required }}
      {{- $_ := set $affinity "nodeAffinity" $nodeAffinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: zxporter-nodemon
          securityContext:
          {{- if $runtimeAsRoot }}
            runAsNonRoot: false
            runAsUser: 0
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - SYS_PTRACE
            # Bottlerocket (SELinux enforcing) gives each container a unique MCS
            # category pair, which denies reading other containers' files via
            # /proc/<pid>/root (JVM hsperfdata, runtime binaries). Granting the
            # full category range keeps the container_t type; it is a no-op where
            # SELinux is not enforcing.
            seLinuxOptions:
              level: "s0:c0.c1023"
          {{- else }}
          {{- toYaml $.Values.nodemon.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "zxporter-nodemon.image" (dict "image" $.Values.image "defaultTag" $.Chart.AppVersion "global" $.Values.global) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.nodemon.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          envFrom:
            - configMapRef:
                name: {{- include "zxporter-nodemon.config-map" $ | indent 1}}
          env:
            - name: "NODE_NAME"
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: "POD_NAME"
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: "POD_NAMESPACE"
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Cap GOMAXPROCS: nodemon has no CPU limit, so on high-core GPU nodes
            # the Go runtime would otherwise size P's/GC workers to the full node
            # core count, inflating baseline memory. nodemon's work is light.
            - name: "GOMAXPROCS"
              value: {{ $.Values.nodemon.goMaxProcs | default 2 | quote }}
            - name: "RUNTIME_METRICS_ENABLED"
              value: {{ $runtimeMetricsEnabled | quote }}
            - name: "CGROUP_METRICS_ENABLED"
              value: {{ $cgroupMetricsEnabled | quote }}
            {{- if $scanHandlerTimeoutMs }}
            - name: "SCAN_HANDLER_TIMEOUT_MS"
              value: {{ $scanHandlerTimeoutMs | quote }}
            {{- end }}

          {{- if $v.dcgmHost }}
            - name: "DCGM_HOST"
              value: "localhost"
          {{- end }}
          {{- if $cgroupMetricsEnabled }}
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml $.Values.nodemon.resources | nindent 12 }}
        {{- if $v.withDcgm }}
        - name: dcgm-exporter
          securityContext:
            # SYS_ADMIN alone is not enough: enumerating MIG Compute Instance
            # profiles via NVML needs broader host access than that one
            # capability grants (confirmed live -- SYS_ADMIN-only reproduces
            # "CacheManager Init Failed. Error: -17" the instant any MIG
            # instance exists on the node; switching to privileged fixes it
            # with zero other changes). This is a generic NVML/driver
            # requirement, not provider-specific, so unlike the hostPath/
            # LD_LIBRARY_PATH blocks below it must not be gated on gcp only.
            capabilities:
              add:
                - SYS_ADMIN
              drop:
                - NET_RAW
            runAsNonRoot: false
            runAsUser: 0
            privileged: true
          image: {{ include "zxporter-nodemon.image" (dict "image" $.Values.dcgmExporter.image "global" $.Values.global) | quote }}
          imagePullPolicy: {{ $.Values.dcgmExporter.image.pullPolicy }}
          command: [ "/bin/bash", "-c" ]
          args:
          {{- if $.Values.dcgmExporter.useExternalHostEngine }}
            - hostname $NODE_NAME; for ((;;)) { r=$(dcgm-exporter --remote-hostengine-info ${NODE_IP} -f /etc/dcgm-exporter/counters.csv); echo "dcgm-exporter could not run"; sleep 60 ; }
          {{- else }}
            - hostname $NODE_NAME; for ((;;)) { r=$(dcgm-exporter -f /etc/dcgm-exporter/counters.csv); echo "dcgm-exporter could not run"; sleep 60 ; }
          {{- end }}
          ports:
            - name: "metrics"
              containerPort: 9400
          env:
            - name: "DCGM_EXPORTER_KUBERNETES"
              value: "true"
            - name: "DCGM_EXPORTER_LISTEN"
              value: ":9400"
            - name: "DCGM_EXPORTER_INTERVAL"
              value: "5000"
            - name: "NODE_NAME"
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if $.Values.dcgmExporter.useExternalHostEngine }}
            - name: "NODE_IP"
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- end }}
            {{- $hasCustomVisibleDevices := false }}
            {{- range $.Values.dcgmExporter.extraEnv }}
            {{- if eq .name "NVIDIA_VISIBLE_DEVICES" }}
            {{- $hasCustomVisibleDevices = true }}
            {{- end }}
            {{- end }}
            {{- if not $hasCustomVisibleDevices }}
            # Without this, nvidia-container-runtime's "auto" mode only exposes
            # whole/non-MIG GPUs to a non-privileged container with no explicit
            # device-plugin resource request (which this sidecar deliberately
            # doesn't make, since it must see every GPU on the node, not just
            # one). MIG-partitioned GPUs stay invisible without it -- confirmed
            # by direct comparison against GPU Operator's own dcgm-exporter,
            # which gets the same visibility via privileged:true instead; this
            # is the minimal fix that doesn't need the broader grant.
            - name: "NVIDIA_VISIBLE_DEVICES"
              value: "all"
            {{- end }}
            {{- $hasCustomLDLibraryPath := false }}
            {{- range $.Values.dcgmExporter.extraEnv }}
            {{- if eq .name "LD_LIBRARY_PATH" }}
            {{- $hasCustomLDLibraryPath = true }}
            {{- end }}
            {{- end }}
            {{- if and (eq $.Values.global.k8sProvider "gcp") (not $hasCustomLDLibraryPath) }}
            - name: "LD_LIBRARY_PATH"
              value: "/usr/local/nvidia/lib64"
            {{- end }}
            {{- if eq $.Values.global.k8sProvider "gcp" }}
            - name: "DCGM_EXPORTER_KUBERNETES_GPU_ID_TYPE"
              value: "device-name"
            {{- end }}
            {{- with $.Values.dcgmExporter.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: "pod-gpu-resources"
              readOnly: true
              mountPath: "/var/lib/kubelet/pod-resources"
            {{- if eq $.Values.global.k8sProvider "gcp" }}
            - name: "nvidia-install-dir-host"
              mountPath: /usr/local/nvidia
            {{- end }}
            - name: {{- include "dcgm-exporter.config-map" $ | indent 1 }}
              mountPath: "/etc/dcgm-exporter"
          {{- with $.Values.dcgmExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
{{- end }}
