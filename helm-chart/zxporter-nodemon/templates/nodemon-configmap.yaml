apiVersion: v1
kind: ConfigMap
metadata:
  {{- with (include "zxporter-nodemon.commonLabels" $) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
  {{- with (include "zxporter-nodemon.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  name: {{- include "zxporter-nodemon.config-map" . | indent 1}}
  namespace: {{ .Release.Namespace }}
data:
{{- $config := .Values.nodemon.config | default dict }}
{{- if $config }}
  {{- toYaml $config | nindent 2 }}
{{- end }}
