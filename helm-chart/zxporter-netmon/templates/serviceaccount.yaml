{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zxporter-netmon.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zxporter-netmon.labels" . | nindent 4 }}
  {{- /* serviceAccount.annotations wins over commonAnnotations on a key
         collision. Merged here rather than emitted as two blocks because
         `with` rebinds the dot, which would hand the helper the annotation
         map instead of the root context. */}}
  {{- $saAnnotations := merge (deepCopy (.Values.serviceAccount.annotations | default dict)) (fromYaml (include "zxporter-netmon.commonAnnotations" $)) }}
  {{- with $saAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
