apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  {{- with (include "zxporter-netmon.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  name: "{{ include "zxporter-netmon.fullname" . }}"
  labels: {{- include "zxporter-netmon.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
