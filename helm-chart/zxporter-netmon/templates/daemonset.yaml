apiVersion: apps/v1
kind: DaemonSet
metadata:
  {{- with (include "zxporter-netmon.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  name: {{ include "zxporter-netmon.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zxporter-netmon.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "zxporter-netmon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* podExtraAnnotations already merges .Values.podAnnotations with the
             common and global values, so this emits the merged map once. A
             second `toYaml .Values.podAnnotations` here would duplicate every
             key it holds. */}}
      {{- with (include "zxporter-netmon.podExtraAnnotations" $) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- with (include "zxporter-netmon.podExtraLabels" $) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "zxporter-netmon.selectorLabels" . | nindent 8 }}
    spec:
      {{- with include "zxporter-netmon.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "zxporter-netmon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "zxporter-netmon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.config.mainConfigMapName }}
                optional: true
            {{- if .Values.config.tokenSecretName }}
            - secretRef:
                name: {{ .Values.config.tokenSecretName }}
                optional: true
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with include "devzero-common.dakrUrl" (list . .Values.config.dakrUrl) }}
            - name: DAKR_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.clusterToken }}
            - name: CLUSTER_TOKEN
              value: {{ .Values.config.clusterToken | quote }}
            {{- end }}
            - name: FLUSH_INTERVAL
              value: {{ .Values.config.exportInterval | quote }}
          args:
            - "-collector-mode={{ .Values.config.collectorMode }}"
            - "-metrics-bind-address=:{{ .Values.config.containerPort }}"
            {{- if .Values.config.containerRedMetrics }}
            - "-container-red-metrics"
            {{- end }}
            {{- if .Values.config.pprofBindAddress }}
            - "-pprof-bind-address={{ .Values.config.pprofBindAddress }}"
            {{- if .Values.config.pprofMutexFraction }}
            - "-pprof-mutex-fraction={{ .Values.config.pprofMutexFraction }}"
            {{- end }}
            {{- if .Values.config.pprofBlockRate }}
            - "-pprof-block-rate={{ .Values.config.pprofBlockRate }}"
            {{- end }}
            {{- end }}
            # - "-log-level={{ .Values.config.logLevel }}"
          resources:
            {{- if .Values.config.containerRedMetrics }}
            {{- toYaml .Values.containerRedMetricsResources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: zxporter-config
              mountPath: /etc/zxporter
              readOnly: true
            {{- if eq .Values.config.collectorMode "cilium" }}
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            {{- end }}
      volumes:
        - name: zxporter-config
          configMap:
            name: {{ .Values.config.mainConfigMapName }}
            optional: true
        {{- if eq .Values.config.collectorMode "cilium" }}
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
