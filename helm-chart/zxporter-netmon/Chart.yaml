apiVersion: v2
name: zxporter-netmon
description: A Helm chart for zxporter network monitor daemonset
type: application
version: 0.1.25
appVersion: "0.1.25"
# Oldest Kubernetes DevZero supports: the oldest version the operator kind
# matrices test (KUB-155 §3.6). Helm refuses an older cluster. Raising it is a
# breaking change.
kubeVersion: ">=1.31.0-0"
dependencies:
  # Shared DevZero chart conventions (labels). A byte-identical copy of the
  # monorepo's charts/devzero-common, kept here so the public zxporter repo
  # carries it; scripts/chart_lint.py fails CI if the copy drifts.
  - name: devzero-common
    version: 0.1.0
    repository: "file://../devzero-common"
